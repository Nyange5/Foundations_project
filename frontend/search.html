<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a trip – ETIKE</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">ETIKE</a>
      <nav aria-label="Main">
        <ul class="topbar-links">
          <li><a href="search.html">Find a trip</a></li>
        </ul>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main id="main" class="page wrap page-narrow">
    <h1>Find a trip</h1>
    <p class="page-sub">Buses, shared seats and private cars between districts.</p>

    <form class="form" id="search" action="results.html" novalidate>
      <div class="modes" role="radiogroup" aria-label="How do you want to travel?">
        <label class="mode">
          <input type="radio" name="type" value="bus" checked>
          <span>Bus</span>
        </label>
        <label class="mode">
          <input type="radio" name="type" value="shared">
          <span>Shared seat</span>
        </label>
        <label class="mode">
          <input type="radio" name="type" value="private">
          <span>Private car</span>
        </label>
      </div>
      <div class="stops">
        <label class="stop stop-from">
          <span class="sr">Leaving from</span>
          <select name="origin" required></select>
        </label>
        <label class="stop stop-to">
          <span class="sr">Going to</span>
          <select name="destination" required></select>
        </label>
      </div>
      <label class="field">
        <span>Date</span>
        <input type="date" name="date">
      </label>
      <button class="btn-black" type="submit">Search</button>
      <p class="trip-msg" id="msg" role="alert"></p>
    </form>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p class="brand">ETIKE</p>
      <p>Intercity Travel Platform. Team 3, BSc Software Engineering, African Leadership University, Kigali.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
